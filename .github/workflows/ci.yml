name: CI Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  archetype:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Comprobar existencia de pom.xml
        run: |
          if [ -f pom.xml ]; then
            echo "pom.xml found"
          else
            echo "Error: pom.xml not found."
            exit 1
          fi

      - name: Extraer groupId, artifactId y version de pom.xml
        id: extract
        run: |
          GROUP=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "group=${GROUP}" >> $GITHUB_OUTPUT
          echo "artifact=${ARTIFACT}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
    outputs:
      group: ${{ steps.extract.outputs.group }}
      artifact: ${{ steps.extract.outputs.artifact }}
      version: ${{ steps.extract.outputs.version }}

  build:
    runs-on: ${{ matrix.os }}
    needs: archetype
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        distribution: [temurin, zulu]
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (${{ matrix.distribution }})
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: ${{ matrix.distribution }}

      - name: Restaurar caché de dependencias de Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-dependencies-${{ matrix.os }}-${{ matrix.distribution }}-${{ needs.archetype.outputs.artifact }}-${{ needs.archetype.outputs.version }}

      - name: Construir proyecto con Maven
        run: mvn clean compile test package verify

      - name: Guardar JAR
        if: matrix.os == 'ubuntu-22.04' && matrix.distribution == 'temurin'
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: target/${{ needs.archetype.outputs.artifact }}-${{ needs.archetype.outputs.version }}.jar

      - name: Generar reporte de cobertura con JaCoCo
        run: mvn jacoco:report

      - name: Guardar reporte de cobertura
        if: matrix.os == 'ubuntu-22.04' && matrix.distribution == 'temurin'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

  coverage-check:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: reports

      - name: Comprobar cobertura de código
        run: |
          THRESHOLD=80
          LINE=$(grep -o '<counter type="LINE"[^>]*>' reports/jacoco.xml | tail -n 1)
          MISSED=$(echo "$LINE" | grep -Po 'missed="\K[0-9]+')
          COVERED=$(echo "$LINE" | grep -Po 'covered="\K[0-9]+')
          COVERAGE=$(echo "scale=2; $COVERED * 100 / ($MISSED + $COVERED)" | bc -l)
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Error: La cobertura de código es menor al ${THRESHOLD}%."
            exit 1
          fi
          echo "Cobertura de código: $COVERAGE%"